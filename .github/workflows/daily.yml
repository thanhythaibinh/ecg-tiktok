name: ECG TikTok – video hằng ngày
on:
  schedule:
    - cron: "7 11 * * *"   # 18:07 giờ VN
  workflow_dispatch:
    inputs:
      count: {description: "Số video", default: "1"}
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Tạo video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python -m ecgtok.pipeline next --count ${{ inputs.count || 1 }}
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            output/*/video.mp4
            output/*/cover.jpg
            output/*/caption.txt
            output/*/script.json
      - name: Lưu tiến độ
        run: |
          git config user.name "ecg-bot"; git config user.email "ecg-bot@users.noreply.github.com"
          git add state.json && git commit -m "Cập nhật tiến độ bài học" && git push || echo "không có thay đổi"
