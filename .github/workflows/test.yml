name: Kiểm thử dựng video
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m py_compile ecgtok/*.py
      - name: Vẽ thử đủ 24 kiểu nhịp
        run: python -c "from ecgtok import ecg;[ecg.build(r,75) for r in ecg.RHYTHMS];print('ok',len(ecg.RHYTHMS))"
      - name: Dựng thử 1 video (kịch bản offline, giọng đọc thật)
        run: python -m ecgtok.pipeline lesson 11 --offline --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: video-thu
          path: output/*/video.mp4
